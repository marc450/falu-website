name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are skipped in favour of the newest,
# but a run that already started deploying is left to finish: cancelling it
# mid-deploy strands a pending deployment on the Pages side. This matches
# GitHub's own Pages starter workflow.
#
# Note: deploy-pages can still fail with "Timeout reached" after 10 minutes of
# `deployment_queued`. That is GitHub's Pages queue, not this repo — the build
# job always passes, and the next push deploys normally. Its `timeout` input is
# capped at 600000 ms, so it cannot be raised.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
