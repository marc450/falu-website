name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is force-pushed to the gh-pages branch, which Pages serves.
# We used to deploy through actions/deploy-pages, but that route queues on the
# Pages deployment API — which spent 3-12 minutes on a 360 KB artifact and
# regularly overran the action's fixed, unraisable 10-minute timeout. A commit
# gets only one deployment there (the deployment id is the commit sha), so a
# timeout meant that commit simply never published.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $GITHUB_SHA"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
